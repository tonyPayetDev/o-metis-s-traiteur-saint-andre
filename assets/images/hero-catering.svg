<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4739"/>
      <stop offset="100%" style="stop-color:#1a2e22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#C9A962" opacity="0.05"/>
  <circle cx="700" cy="500" r="200" fill="#D4A574" opacity="0.03"/>
  
  <!-- Main platter base -->
  <ellipse cx="400" cy="400" rx="280" ry="120" fill="#3D5A49" filter="url(#shadow)"/>
  <ellipse cx="400" cy="390" rx="260" ry="110" fill="url(#goldGrad)" opacity="0.9"/>
  <ellipse cx="400" cy="385" rx="240" ry="100" fill="#2D4739"/>
  
  <!-- Food items on platter -->
  <!-- Samosas -->
  <ellipse cx="280" cy="360" rx="35" ry="25" fill="#D4A574"/>
  <ellipse cx="290" cy="355" rx="35" ry="25" fill="#C9A962"/>
  <ellipse cx="320" cy="370" rx="35" ry="25" fill="#D4A574"/>
  
  <!-- Spring rolls -->
  <rect x="480" y="330" width="60" height="25" rx="12" fill="#C9A962" transform="rotate(15 510 342)"/>
  <rect x="490" y="345" width="60" height="25" rx="12" fill="#D4A574" transform="rotate(10 520 357)"/>
  <rect x="470" y="355" width="60" height="25" rx="12" fill="#B8984A" transform="rotate(20 500 367)"/>
  
  <!-- Mini sandwiches -->
  <rect x="380" y="320" width="50" height="40" rx="5" fill="#F9F6F0"/>
  <rect x="385" y="325" width="50" height="40" rx="5" fill="#EDE8DF"/>
  <rect x="390" y="315" width="50" height="40" rx="5" fill="#F9F6F0"/>
  
  <!-- Garnish/herbs -->
  <circle cx="250" cy="420" r="8" fill="#4A7C59"/>
  <circle cx="270" cy="430" r="6" fill="#5A8C69"/>
  <circle cx="550" cy="410" r="8" fill="#4A7C59"/>
  <circle cx="530" cy="425" r="6" fill="#5A8C69"/>
  <circle cx="400" cy="440" r="10" fill="#4A7C59"/>
  
  <!-- Centerpiece decoration -->
  <circle cx="400" cy="370" r="40" fill="#C9A962" opacity="0.3"/>
  <text x="400" y="385" text-anchor="middle" font-family="serif" font-size="24" fill="#2D4739" font-weight="bold">O Métis S</text>
  
  <!-- Side dishes -->
  <ellipse cx="180" cy="450" rx="60" ry="30" fill="#3D5A49" filter="url(#shadow)"/>
  <ellipse cx="180" cy="445" rx="50" ry="25" fill="#D4A574"/>
  <text x="180" y="452" text-anchor="middle" font-size="12" fill="#2D4739">Sauces</text>
  
  <ellipse cx="620" cy="450" rx="60" ry="30" fill="#3D5A49" filter="url(#shadow)"/>
  <ellipse cx="620" cy="445" rx="50" ry="25" fill="#C9A962"/>
  <text x="620" y="452" text-anchor="middle" font-size="12" fill="#2D4739">Desserts</text>
  
  <!-- Floating elements -->
  <circle cx="150" cy="200" r="30" fill="#C9A962" opacity="0.2"/>
  <circle cx="650" cy="150" r="40" fill="#D4A574" opacity="0.15"/>
  <circle cx="750" cy="300" r="25" fill="#C9A962" opacity="0.2"/>
</svg>
