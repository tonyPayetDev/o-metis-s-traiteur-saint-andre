<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="ab2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#F9F6F0"/>
  
  <!-- Team/Staff -->
  <ellipse cx="200" cy="250" rx="150" ry="30" fill="#2D4739" opacity="0.1"/>
  
  <!-- Person 1 -->
  <ellipse cx="120" cy="180" rx="35" ry="45" fill="#D4A574"/>
  <rect x="90" y="210" width="60" height="50" rx="10" fill="#fff"/>
  <rect x="95" y="200" width="50" height="20" fill="#2D4739"/>
  
  <!-- Person 2 -->
  <ellipse cx="200" cy="170" rx="35" ry="45" fill="#C9A962"/>
  <rect x="170" y="200" width="60" height="55" rx="10" fill="#fff"/>
  <rect x="175" y="190" width="50" height="20" fill="#2D4739"/>
  <!-- Chef hat -->
  <rect x="185" y="130" width="30" height="25" rx="5" fill="#fff"/>
  
  <!-- Person 3 -->
  <ellipse cx="280" cy="180" rx="35" ry="45" fill="#D4A574"/>
  <rect x="250" y="210" width="60" height="50" rx="10" fill="#fff"/>
  <rect x="255" y="200" width="50" height="20" fill="#2D4739"/>
  
  <!-- Decorative frame -->
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="url(#ab2Bg)" stroke-width="3" rx="10"/>
</svg>
