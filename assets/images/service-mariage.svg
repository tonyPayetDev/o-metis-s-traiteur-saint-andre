<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="wedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9F6F0"/>
      <stop offset="100%" style="stop-color:#EDE8DF"/>
    </linearGradient>
    <linearGradient id="wedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A962"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#wedBg)"/>
  
  <!-- Table -->
  <ellipse cx="300" cy="320" rx="250" ry="60" fill="#2D4739" opacity="0.1"/>
  
  <!-- Wedding cake tiers -->
  <rect x="220" y="180" width="160" height="80" rx="10" fill="#F9F6F0" stroke="#C9A962" stroke-width="2"/>
  <rect x="240" y="120" width="120" height="60" rx="8" fill="#F9F6F0" stroke="#C9A962" stroke-width="2"/>
  <rect x="260" y="70" width="80" height="50" rx="6" fill="#F9F6F0" stroke="#C9A962" stroke-width="2"/>
  
  <!-- Cake decorations -->
  <circle cx="260" cy="160" r="8" fill="#C9A962"/>
  <circle cx="300" cy="150" r="8" fill="#D4A574"/>
  <circle cx="340" cy="160" r="8" fill="#C9A962"/>
  <circle cx="280" cy="110" r="6" fill="#D4A574"/>
  <circle cx="320" cy="105" r="6" fill="#C9A962"/>
  
  <!-- Topper -->
  <circle cx="300" cy="55" r="15" fill="#C9A962"/>
  <text x="300" y="62" text-anchor="middle" font-size="20" fill="#fff">&lt;3</text>
  
  <!-- Champagne glasses -->
  <path d="M120 250 L120 320 L100 340 L160 340 L140 320 L140 250 Z" fill="none" stroke="#C9A962" stroke-width="3"/>
  <path d="M130 250 L130 290 Q130 310 150 310 Q170 310 170 290 L170 250 Z" fill="url(#wedGold)" opacity="0.6"/>
  
  <path d="M460 250 L460 320 L440 340 L500 340 L480 320 L480 250 Z" fill="none" stroke="#C9A962" stroke-width="3"/>
  <path d="M470 250 L470 290 Q470 310 450 310 Q430 310 430 290 L430 250 Z" fill="url(#wedGold)" opacity="0.6"/>
  
  <!-- Flower petals -->
  <ellipse cx="100" cy="360" rx="15" ry="8" fill="#D4A574" opacity="0.5" transform="rotate(30 100 360)"/>
  <ellipse cx="500" cy="370" rx="15" ry="8" fill="#C9A962" opacity="0.5" transform="rotate(-20 500 370)"/>
  <ellipse cx="200" cy="380" rx="12" ry="6" fill="#D4A574" opacity="0.4"/>
  <ellipse cx="400" cy="375" rx="12" ry="6" fill="#C9A962" opacity="0.4"/>
  
  <!-- Decorative frame -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#C9A962" stroke-width="2" opacity="0.3" rx="20"/>
</svg>
